```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solvix - Dilution</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>

    <div class="container">


        <!-- Header -->

        <header class="header">

            <div class="logo">
                SOLVIX
            </div>

            <div class="subtitle">
                Dilution Calculator
            </div>

            <p class="choose-text">
                C₁V₁ = C₂V₂
            </p>

        </header>



        <!-- Calculator -->

        <div class="calculator">


            <!-- Calculate -->

            <div class="input-group">

                <label for="dilutionUnknown">
                    Calculate
                </label>

                <div class="input-row">

                    <select
                        id="dilutionUnknown"
                        onchange="updateDilutionFields()"
                        style="
                            width: 100%;
                            border: none;
                            outline: none;
                            background: transparent;
                            padding: 14px;
                            font-size: 16px;
                        "
                    >

                        <option value="v2">
                            Final Volume (V₂)
                        </option>

                        <option value="v1">
                            Initial Volume (V₁)
                        </option>

                        <option value="c2">
                            Final Concentration (C₂)
                        </option>

                        <option value="c1">
                            Initial Concentration (C₁)
                        </option>

                    </select>

                </div>

            </div>



            <!-- C1 -->

            <div class="input-group">

                <label for="c1">
                    Initial Concentration (C₁)
                </label>

                <div class="input-row">

                    <input
                        type="number"
                        id="c1"
                        placeholder="Enter C₁"
                        step="any"
                    >

                    <span>unit</span>

                </div>

            </div>



            <!-- V1 -->

            <div class="input-group">

                <label for="v1">
                    Initial Volume (V₁)
                </label>

                <div class="input-row">

                    <input
                        type="number"
                        id="v1"
                        placeholder="Enter V₁"
                        step="any"
                    >

                    <span>mL</span>

                </div>

            </div>



            <!-- C2 -->

            <div class="input-group">

                <label for="c2">
                    Final Concentration (C₂)
                </label>

                <div class="input-row">

                    <input
                        type="number"
                        id="c2"
                        placeholder="Enter C₂"
                        step="any"
                    >

                    <span>unit</span>

                </div>

            </div>



            <!-- V2 -->

            <div class="input-group">

                <label for="v2">
                    Final Volume (V₂)
                </label>

                <div class="input-row">

                    <input
                        type="number"
                        id="v2"
                        placeholder="Enter V₂"
                        step="any"
                    >

                    <span>mL</span>

                </div>

            </div>



            <!-- Calculate Button -->

            <button onclick="calculateDilution()">
                CALCULATE
            </button>



            <!-- Result -->

            <div class="result">

                <div class="result-label">
                    Result
                </div>

                <div id="dilutionResult">
                    Enter values to calculate.
                </div>

            </div>



            <!-- Formula -->

            <div
                style="
                    margin-top: 20px;
                    padding: 15px;
                    background: #f8fafc;
                    border-radius: 12px;
                    text-align: center;
                    color: #475569;
                    font-size: 14px;
                "
            >

                <strong>
                    Dilution Formula
                </strong>

                <br>

                C₁ × V₁ = C₂ × V₂

            </div>



            <!-- Back to Home -->

            <button
                onclick="goHome()"
                style="margin-top: 15px;"
            >
                BACK TO HOME
            </button>


        </div>

    </div>



    <!-- JavaScript -->

    <script src="../script.js"></script>

</body>

</html>
```
